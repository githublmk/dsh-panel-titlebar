name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check the plugin modules
        run: |
          node --check index.js
          node --check client.js

      - name: Run the bundle contract tests
        run: node --test test/bundle.test.mjs

      - name: Verify the published file list
        run: npm pack --dry-run
